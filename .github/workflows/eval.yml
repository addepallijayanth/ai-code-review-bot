name: Eval

# Runs the seeded-bug dataset through the real review pipeline and publishes precision, recall,
# cost and latency. It calls the Claude API (about 30 reviews, a few dollars at most per run), so it
# only runs when the ANTHROPIC_API_KEY repository secret is set.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      case:
        description: Run a single case (its folder name, e.g. 002-sql-injection); leave empty for all
        required: false

permissions:
  contents: read

jobs:
  eval:
    name: Seeded-bug evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CASE: ${{ inputs.case }}
    steps:
      - name: Check for an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: add an \`ANTHROPIC_API_KEY\` repository secret to run the evaluation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the eval runner
        if: steps.key.outputs.present == 'true'
        run: ./mvnw -B -ntp -pl eval -am package -DskipTests

      - name: Run the evaluation
        if: steps.key.outputs.present == 'true'
        run: java -jar eval/target/eval-1.0.0.jar --dataset eval/dataset --out eval/results ${CASE:+--case "$CASE"}

      - name: Publish the report
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f eval/results/report.md ]; then
            cat eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
