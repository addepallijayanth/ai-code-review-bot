# Local stack: the reviewer app, PostgreSQL and Redis.
#   cp .env.example .env   # fill in the GitHub App and Anthropic settings
#   docker compose up --build
name: ai-code-review-bot

services:
  app:
    build:
      context: .
      dockerfile: reviewer-app/Dockerfile
    image: ai-code-review-bot:local
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reviewbot
      SPRING_DATASOURCE_USERNAME: reviewbot
      SPRING_DATASOURCE_PASSWORD: reviewbot
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reviewbot
      POSTGRES_USER: reviewbot
      POSTGRES_PASSWORD: reviewbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewbot -d reviewbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
